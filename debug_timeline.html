@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap');

/* ── Colour variables (Design palette → app-native hex) ── */
:root {
  --bg:       #F5F4F0;
  --bg-card:  #ffffff;
  --navy:     #1a1a2e;
  --navy-mid: #1a3a5c;
  --muted:    #8a9ab0;
  --divider:  #E8E5DE;
  --spine:    #9ab8d0;
  /* Category colours — muted, readable on beige/white */
  --c-unifil:      #2a748a;   --c-unifil-bg:    #e4f2f5;
  --c-military:    #8a4a1a;   --c-military-bg:  #f5ede3;
  --c-attack:      #8a2828;   --c-attack-bg:    #f5e4e4;
  --c-politics:    #5a3a80;   --c-politics-bg:  #ede4f5;
  --c-un:          #2a508a;   --c-un-bg:        #e4ecf5;
  --c-ceasefire:   #2a7a5a;   --c-ceasefire-bg: #e4f5ee;
}

/* ── Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: #3a3a3a;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── Header — matches .library-header / .library-title ── */
.page-header {
  background: var(--bg);
  border-bottom: 1px solid var(--divider);
  padding: 1.5rem 48px 1rem;
  position: static;
  z-index: auto;
}
.header-eyebrow { display: none; }
.header-top     { display: flex; align-items: baseline; gap: 16px; margin-bottom: 6px; }
.header-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: -0.01em;
  line-height: 1.2;
}
.header-stats  { display: flex; gap: 20px; margin-left: auto; align-items: center; }
.stat-item     { display: flex; align-items: baseline; gap: 4px; }
.stat-num {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.88rem;
  font-weight: 600;
  color: #6b7c8d;
  line-height: 1;
}
.stat-label {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.72rem;
  font-weight: 400;
  color: var(--muted);
  text-transform: lowercase;
  letter-spacing: 0;
  margin-top: 0;
}

/* ── Filter bar — light, no heavy box ── */
.controls-bar {
  background: var(--bg);
  border-bottom: 1px solid var(--divider);
  padding: 10px 48px;
  display: flex;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
  position: static;
  z-index: auto;
}
.controls-section { display: flex; align-items: center; gap: 12px; }
.controls-label {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
/* Dual range slider */
.range-wrap {
  position: relative; width: 240px; max-width: 240px;
  flex-shrink: 0; height: 28px; display: flex; align-items: center;
}
.range-track {
  position: absolute; width: 100%; height: 3px;
  background: var(--divider); border-radius: 2px; pointer-events: none;
}
.range-fill {
  position: absolute; height: 3px;
  background: var(--navy-mid); border-radius: 2px; pointer-events: none;
}
.range-input {
  position: absolute; width: 100%; height: 3px;
  background: none; -webkit-appearance: none; appearance: none; pointer-events: none;
}
.range-input::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
  background: var(--navy-mid); border: 2px solid var(--bg-card);
  box-shadow: 0 1px 4px rgba(0,0,0,0.2); pointer-events: all; cursor: pointer;
}
.range-input::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--navy-mid); border: 2px solid var(--bg-card); pointer-events: all; cursor: pointer;
}
.range-val {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.82rem; font-weight: 600;
  color: var(--navy-mid); min-width: 32px; text-align: center;
}
/* Category filter pills */
.pill-wrap { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  display: flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 3px;
  border: 1.5px solid transparent;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.68rem; font-weight: 500;
  cursor: pointer; background: #ECEAE4; color: #6b7c8d; white-space: nowrap;
}
.pill:hover { border-color: currentColor; }
.pill.active { background: var(--navy-mid); color: white; border-color: var(--navy-mid); }
.pill-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.result-count {
  margin-left: auto;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.72rem; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}

/* ── Main layout ── */
.main-wrap {
  display: grid; grid-template-columns: 200px 1fr;
  max-width: 1140px; margin: 0 auto;
  padding: 24px 32px 80px; gap: 0;
}

/* ── Left decade nav ── */
.decade-nav { padding-top: 8px; padding-right: 24px; align-self: start; }
.decade-nav-label {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.68rem; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 12px;
}
.decade-nav-item {
  display: flex; align-items: center; gap: 8px; padding: 5px 0;
  cursor: pointer; border: none; background: none; width: 100%; text-align: left;
}
.decade-nav-year {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.82rem; font-weight: 600; color: var(--muted); min-width: 36px;
}
.decade-nav-item.active .decade-nav-year { color: var(--navy-mid); }
.decade-nav-bar {
  height: 3px; background: var(--divider); border-radius: 2px;
  flex: 1; position: relative; overflow: hidden;
}
.decade-nav-item.active .decade-nav-bar { background: var(--spine); }
.decade-nav-fill {
  position: absolute; left: 0; top: 0; height: 100%;
  background: var(--navy-mid); border-radius: 2px;
}
.decade-nav-count { font-size: 0.68rem; color: var(--muted); min-width: 20px; text-align: right; }

/* ── Density chart ── */
.density-wrap {
  margin-bottom: 24px; padding: 12px 16px;
  background: white; border: 1px solid var(--divider); border-radius: 3px;
}
.density-label {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.68rem; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
}
.density-chart { display: flex; align-items: flex-end; gap: 2px; height: 48px; }
.density-bar-wrap {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; height: 100%; justify-content: flex-end; cursor: pointer; gap: 3px;
}
.density-bar { width: 100%; border-radius: 2px 2px 0 0; background: var(--spine); min-height: 2px; }
.density-bar-wrap:hover .density-bar,
.density-bar-wrap.active .density-bar { background: var(--navy-mid); }
.density-bar-year { font-size: 0.6rem; color: var(--muted); white-space: nowrap; }

/* ── Decade section headings ── */
.decade-section { margin-bottom: 0; }
.decade-heading {
  display: flex; align-items: center; gap: 16px;
  padding: 20px 0 12px; position: static;
  background: var(--bg);
}
.decade-heading::before {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 1px; background: var(--divider);
}
.decade-year-label {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.1rem; font-weight: 700; color: var(--navy); letter-spacing: -0.01em; line-height: 1;
}
.decade-pill {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.68rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); background: var(--divider); padding: 2px 7px; border-radius: 10px;
}

/* ── Spine ── */
.timeline-wrap { position: relative; }
.events-column { position: relative; padding-left: 32px; padding-top: 4px; }
.spine-line { position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--divider); }

/* ── Event rows ── */
.event-row {
  display: grid; grid-template-columns: 90px 1fr;
  gap: 0 16px; padding: 0; margin-bottom: 0.6rem;
  align-items: start; position: relative; opacity: 1;
}
.event-row.filtered-out { display: none; }
.event-date-col { text-align: right; padding-top: 2px; position: relative; }
.event-date {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.72rem; font-weight: 600;
  letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); line-height: 1.4;
}
.spine-dot {
  position: absolute; right: -25px; top: 5px;
  width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid var(--bg); box-shadow: 0 0 0 1.5px var(--spine); z-index: 2;
}
.event-row:hover .spine-dot { transform: scale(1.3); }

/* ── Event cards — Sources Timeline card style ── */
.event-card {
  background: white;
  border: 1px solid #ddd8cc;
  border-left: 3px solid var(--navy-mid);
  border-radius: 3px;
  padding: 0.9rem 1.1rem;
  cursor: default;
}
.event-row:hover .event-card { box-shadow: 0 1px 6px rgba(26,58,92,0.08); }
.event-card-top { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 3px; }

/* ── Category badge — tag style, per-colour ── */
.event-category-badge {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.68rem; font-weight: 500;
  letter-spacing: 0.07em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 3px;
  white-space: nowrap; flex-shrink: 0; margin-top: 1px;
}

/* ── Event text ── */
.event-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 0.95rem; font-weight: 700;
  color: var(--navy-mid); margin-bottom: 0.2rem; letter-spacing: 0.01em;
}
.event-desc {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.83rem; line-height: 1.5; color: #3a3a3a;
}
.event-source {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.72rem; color: var(--muted); margin-top: 4px; font-style: italic;
}
.no-results {
  padding: 48px 0; text-align: center;
  color: var(--muted); font-style: italic; font-size: 0.9rem;
}

/* ── Edit controls ── */
.edit-btn {
  position: absolute; top: 8px; right: 8px;
  width: 26px; height: 26px; border-radius: 4px;
  border: 1px solid var(--divider); background: var(--bg); color: var(--muted);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  opacity: 0; flex-shrink: 0;
}
.event-row:hover .edit-btn { opacity: 1; }
.edit-btn:hover { background: var(--navy-mid); color: white; border-color: var(--navy-mid); }
.edit-form { display: flex; flex-direction: column; gap: 8px; }
.edit-textarea {
  width: 100%; font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.83rem; line-height: 1.5; color: #1a1a2e;
  background: #FAFAF8; border: 1.5px solid var(--navy-mid);
  border-radius: 3px; padding: 8px 10px; resize: vertical; min-height: 80px; outline: none;
}
.edit-source-input {
  font-family: 'IBM Plex Sans', sans-serif; font-size: 0.72rem; color: var(--muted);
  background: #FAFAF8; border: 1.5px solid var(--divider);
  border-radius: 3px; padding: 5px 8px; outline: none; width: 100%;
}
.edit-actions { display: flex; gap: 6px; justify-content: flex-end; }
.edit-save-btn {
  padding: 4px 14px; background: var(--navy-mid); color: white;
  border: none; border-radius: 3px;
  font-family: 'IBM Plex Sans', sans-serif; font-size: 0.72rem; font-weight: 600; cursor: pointer;
}
.edit-cancel-btn {
  padding: 4px 10px; background: none; color: var(--muted);
  border: 1px solid var(--divider); border-radius: 3px;
  font-family: 'IBM Plex Sans', sans-serif; font-size: 0.72rem; cursor: pointer;
}
.edited-marker {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.68rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: #6b7c8d; margin-left: auto; align-self: center;
}

/* ── Tweaks panel — not needed in app context ── */
.tweaks-panel { display: none; }

/* ── Responsive ── */
@media (max-width: 700px) {
  .page-header  { padding: 1rem 16px 0.75rem; }
  .header-stats { display: none; }
  .controls-bar { padding: 10px 16px; }
  .main-wrap    { grid-template-columns: 1fr; padding: 12px; }
  .decade-nav   { display: none; }
}
</style>

// Compute decade groups
function getDecade(year) {
  if (year < 1980) return '1967–1979';
  if (year < 1990) return '1980s';
  if (year < 2000) return '1990s';
  if (year < 2010) return '2000s';
  if (year < 2020) return '2010s';
  return '2020s';
}

const DECADE_ORDER = ['1967–1979','1980s','1990s','2000s','2010s','2020s'];

// 5-year buckets for density chart
const BUCKETS = [];
for (let y = 1965; y < 2030; y += 5) {
  BUCKETS.push({ start: y, end: y + 4, label: `${y}` });
}

const MONTH_IDX = { jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12 };
function parseSortKey(dateStr) {
  const s = String(dateStr).trim();
  if (/^\d{4}(-\d{1,2}(-\d{1,2})?)?$/.test(s)) {
    const parts = s.split('-').map(Number);
    return [parts[0]||0, parts[1]||0, parts[2]||0];
  }
  const yearM = s.match(/\b(1[89]\d\d|20\d\d)\b/);
  const year = yearM ? parseInt(yearM[1]) : 0;
  const monM = s.toLowerCase().match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/);
  const month = monM ? MONTH_IDX[monM[1]] : 0;
  const dayM = s.match(/\b(\d{1,2})\b/);
  const day = dayM ? parseInt(dayM[1]) : 0;
  return [year, month, day];
}

  const decadeRefs = useRef({});
  const minRef = useRef(); const maxRef = useRef();

  // Editing state
  const [eventsData, setEventsData] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('unifil-events-edits') || '{}');
      const base = EVENTS.map((ev, i) => saved[i] ? { ...ev, ...saved[i] } : { ...ev });
      // Append user-created events stored beyond EVENTS.length
      const extras = Object.keys(saved)
        .map(Number).filter(k => k >= EVENTS.length)
        .sort((a, b) => a - b)
        .map(k => saved[k]);
      return [...base, ...extras];
    } catch(e) { return EVENTS.map(ev => ({ ...ev })); }
  });
  const [editingIdx, setEditingIdx] = useState(null);
  const [draft, setDraft] = useState({ title: '', desc: '', source: '', date: '', cat: '' });
  const [confirmDeleteIdx, setConfirmDeleteIdx] = useState(null);
  const [addingEvent, setAddingEvent] = useState(false);
  const [newDraft, setNewDraft] = useState({ title: '', desc: '', source: '', date: '', cat: 'unifil' });
  const editTextareaRef = useRef();
  const newTitleRef = useRef();

  const persistEdits = (next) => {
    const saved = {};
    next.forEach((ev, i) => {
      if (ev.edited || ev.deleted || ev.userCreated)
        saved[i] = { title: ev.title, desc: ev.desc, source: ev.source, date: ev.date, cat: ev.cat, year: ev.year, edited: ev.edited, deleted: ev.deleted, userCreated: ev.userCreated };
    });
    localStorage.setItem('unifil-events-edits', JSON.stringify(saved));
  };

  const parseYear = (dateStr) => {
    const m = String(dateStr).match(/\b(1[89]\d\d|20\d\d)\b/);
    return m ? parseInt(m[1]) : 0;
  };

  const addEvent = useCallback(() => {
    if (!newDraft.title.trim() && !newDraft.desc.trim()) return;

    setEventsData(prev => {
      const next = [...prev, ev];
      persistEdits(next);
      return next;
    });
    setNewDraft({ title: '', desc: '', source: '', date: '', cat: 'unifil' });
    setAddingEvent(false);
  }, [newDraft]);

  const startEdit = useCallback((idx, ev) => {

    setDraft({ title: ev.title, desc: ev.desc, source: ev.source, date: ev.date, cat: ev.cat });
    setTimeout(() => editTextareaRef.current?.focus(), 50);
  }, []);

  const saveEdit = useCallback((idx) => {
    setEventsData(prev => {
      const next = [...prev];
      const [year] = parseSortKey(draft.date);
      next[idx] = { ...next[idx], ...draft, year: year || next[idx].year, edited: true };
      persistEdits(next);
      return next;
    });
    setEditingIdx(null);
  }, [draft]);

  const deleteEvent = useCallback((idx) => {
    setEventsData(prev => {
      const next = [...prev];
      next[idx] = { ...next[idx], deleted: true };
      persistEdits(next);
      return next;
    });
    setEditingIdx(null);
    setConfirmDeleteIdx(null);
  }, []);

  const cancelEdit = useCallback(() => { setEditingIdx(null); setConfirmDeleteIdx(null); }, []);

  const MIN_YEAR = 1945; const MAX_YEAR = 2026;

  // Listen for tweaks toggle
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  // Restore from localStorage
  useEffect(() => {
    try {
      const s = JSON.parse(localStorage.getItem('unifil-timeline') || '{}');
      if (s.yearMin) setYearMin(s.yearMin);
      if (s.yearMax) setYearMax(s.yearMax);
    } catch(e) {}
  }, []);

  useEffect(() => {
    localStorage.setItem('unifil-timeline', JSON.stringify({ yearMin, yearMax }));
  }, [yearMin, yearMax]);

  const toggleCat = useCallback((id) => {
    setActiveCats(prev => {
      const next = new Set(prev);
      if (next.has(id)) { if (next.size > 1) next.delete(id); }
      else next.add(id);
      return next;
    });
  }, []);

  const isFiltered = yearMin !== MIN_YEAR || yearMax !== MAX_YEAR || activeCats.size !== CATEGORIES.length;

  const clearFilters = useCallback(() => {
    setYearMin(MIN_YEAR);
    setYearMax(MAX_YEAR);
    setActiveCats(new Set(CATEGORIES.map(c => c.id)));
  }, []);

  const filtered = useMemo(() =>
    eventsData
      .map((e, i) => ({ ...e, _idx: i }))
      .filter(e => !e.deleted && e.year >= yearMin && e.year <= yearMax && activeCats.has(e.cat))
      .sort((a, b) => {
        const ka = parseSortKey(a.date), kb = parseSortKey(b.date);
        return ka[0] - kb[0] || ka[1] - kb[1] || ka[2] - kb[2];
      }),
    [eventsData, yearMin, yearMax, activeCats]);

  // Group by decade
  const byDecade = useMemo(() => {
    const map = {};
    for (const d of DECADE_ORDER) map[d] = [];
    for (const e of filtered) {
      const d = getDecade(e.year);
      if (map[d]) map[d].push(e);
    }
    return map;
  }, [filtered]);

  // Density: count per 5-year bucket (from all events)
  const bucketCounts = useMemo(() => {
    return BUCKETS.map(b => ({
      ...b,
      count: EVENTS.filter(e => e.year >= b.start && e.year <= b.end).length,
      filtered: filtered.filter(e => e.year >= b.start && e.year <= b.end).length,
    }));
  }, [filtered]);
  const maxCount = Math.max(...bucketCounts.map(b => b.count));

  // Decade counts
  const decadeCounts = useMemo(() => {
    const map = {};
    for (const d of DECADE_ORDER) {
      map[d] = EVENTS.filter(e => getDecade(e.year) === d).length;
    }
    return map;
  }, []);
  const maxDecadeCount = Math.max(...Object.values(decadeCounts));

  const scrollToDecade = (decade) => {
    const el = decadeRefs.current[decade];
    if (el) {
      const top = el.getBoundingClientRect().top + window.scrollY - 185;
      window.scrollTo({ top, behavior: 'smooth' });
    }
    setActiveDecade(decade);
  };

  // Dual range handler
  const handleMinChange = (e) => {
    const v = Math.min(Number(e.target.value), yearMax - 1);
    setYearMin(v);
  };
  const handleMaxChange = (e) => {
    const v = Math.max(Number(e.target.value), yearMin + 1);
    setYearMax(v);
  };

  const minPct = ((yearMin - MIN_YEAR) / (MAX_YEAR - MIN_YEAR)) * 100;
  const maxPct = ((yearMax - MIN_YEAR) / (MAX_YEAR - MIN_YEAR)) * 100;

  const catMap = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));

  // Scroll spy
  useEffect(() => {
    const handler = () => {
      for (const d of [...DECADE_ORDER].reverse()) {
        const el = decadeRefs.current[d];
        if (!el) continue;
        const rect = el.getBoundingClientRect();
        if (rect.top <= 200) { setActiveDecade(d); break; }
      }
    };
    window.addEventListener('scroll', handler, { passive: true });
    return () => window.removeEventListener('scroll', handler);
  }, []);

  return (
    <div>
      {/* Header */}
      <header className="page-header">
        <div style={{ maxWidth: 1140, margin: '0 auto' }}>
          <div className="header-eyebrow">UNIFIL Research Library</div>
          <div className="header-top">
            <h1 className="header-title">Event Timeline</h1>
            <div className="header-stats">
              <div className="stat-item"><div className="stat-num">27</div><div className="stat-label">Events</div></div>
              <div className="stat-item"><div className="stat-num">37</div><div className="stat-label">Years Covered</div></div>
              <div className="stat-item"><div className="stat-num">37</div><div className="stat-label">Sources</div></div>
            </div>
          </div>
        </div>
      </header>

      {/* Controls */}
      <div className="controls-bar">
        <div className="controls-section">
          <span className="controls-label">Years</span>
          <span className="range-val">{yearMin}</span>
          <div className="range-wrap">
            <div className="range-track" />
            <div className="range-fill" style={{ left: `${minPct}%`, width: `${maxPct - minPct}%` }} />
            <input ref={minRef} className="range-input" type="range"
              min={MIN_YEAR} max={MAX_YEAR} value={yearMin} onChange={handleMinChange}
              style={{ zIndex: yearMin > MAX_YEAR - 10 ? 5 : 3 }} />
            <input ref={maxRef} className="range-input" type="range"
              min={MIN_YEAR} max={MAX_YEAR} value={yearMax} onChange={handleMaxChange}
              style={{ zIndex: 4 }} />
          </div>
          <span className="range-val">{yearMax}</span>
        </div>

        <div className="controls-section">
          <span className="controls-label">Category</span>
          <div className="pill-wrap">
            {CATEGORIES.map(cat => {
              const on = activeCats.has(cat.id);
              return (
                <button key={cat.id} className={`pill${on ? ' active' : ''}`}
                  style={on ? { backgroundColor: cat.color, borderColor: cat.color } : {}}
                  onClick={() => toggleCat(cat.id)}>
                  <span className="pill-dot" style={{ backgroundColor: on ? 'rgba(255,255,255,0.6)' : cat.color }} />
                  {cat.label}
                </button>
              );
            })}
          </div>
        </div>

        {isFiltered && (
          <button onClick={clearFilters} style={{
            background: 'none', border: '1.5px solid var(--divider)', borderRadius: 3,
            padding: '3px 10px', cursor: 'pointer', fontFamily: 'inherit',
            fontSize: 11, fontWeight: 600, letterSpacing: '0.06em',
            color: 'var(--muted)', whiteSpace: 'nowrap', transition: 'all 0.15s',
          }}
          onMouseEnter={e => { e.target.style.borderColor = 'var(--navy-mid)'; e.target.style.color = 'var(--navy)'; }}
          onMouseLeave={e => { e.target.style.borderColor = 'var(--divider)'; e.target.style.color = 'var(--muted)'; }}>
            Clear filters
          </button>
        )}
        <div className="result-count">{filtered.length} events</div>
        <button onClick={() => { setAddingEvent(v => !v); setTimeout(() => newTitleRef.current?.focus(), 50); }} style={{
          padding: '4px 12px', borderRadius: 3, cursor: 'pointer', fontFamily: 'inherit',
          fontSize: 11, fontWeight: 600, letterSpacing: '0.06em', whiteSpace: 'nowrap',
          background: addingEvent ? 'var(--navy-mid)' : 'none',
          color: addingEvent ? 'white' : 'var(--navy-mid)',
          border: '1.5px solid var(--navy-mid)', transition: 'all 0.15s',
        }}>+ Add event</button>
      </div>

      {/* Main */}
      <div className="main-wrap">
        {/* Left nav */}
        <aside className="decade-nav">
          <div className="decade-nav-label">Jump to era</div>
          {DECADE_ORDER.map(d => {
            const cnt = byDecade[d]?.length || 0;
            const total = decadeCounts[d] || 0;
            return (
              <button key={d} className={`decade-nav-item${activeDecade === d ? ' active' : ''}`}
                onClick={() => scrollToDecade(d)}>
                <span className="decade-nav-year">{d}</span>
                <span className="decade-nav-bar">
                  <span className="decade-nav-fill" style={{ width: `${(total / maxDecadeCount) * 100}%` }} />
                </span>
                <span className="decade-nav-count">{cnt}</span>
              </button>
            );
          })}
        </aside>

        {/* Timeline */}
        <div>
          {/* Add event form */}
          {addingEvent && (
            <div style={{
              background: 'var(--bg-card)', border: '1px solid var(--navy-mid)',
              borderRadius: 4, padding: '16px 20px', marginBottom: 20,
              display: 'flex', flexDirection: 'column', gap: 10,
            }}>
              <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase', color: 'var(--navy-mid)', marginBottom: 2 }}>New Event</div>
              <div style={{ display: 'flex', gap: 10 }}>
                <input ref={newTitleRef}
                  className="edit-source-input"
                  style={{ fontStyle: 'normal', fontWeight: 600, fontSize: 13, flex: 2 }}
                  value={newDraft.title}
                  onChange={e => setNewDraft(d => ({ ...d, title: e.target.value }))}
                  placeholder="Title…"
                  onKeyDown={e => { if (e.key === 'Escape') setAddingEvent(false); }}
                />
                <input
                  className="edit-source-input"
                  style={{ fontStyle: 'normal', flex: 1 }}
                  value={newDraft.date}
                  onChange={e => setNewDraft(d => ({ ...d, date: e.target.value }))}
                  placeholder="Date (e.g. Mar 1978 or 1978-03-15)…"
                  onKeyDown={e => { if (e.key === 'Escape') setAddingEvent(false); }}
                />
              </div>
              <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap' }}>
                {CATEGORIES.map(c => {
                  const on = newDraft.cat === c.id;
                  return (
                    <button key={c.id}
                      style={{
                        padding: '2px 8px', borderRadius: 3, cursor: 'pointer',
                        border: `1.5px solid ${on ? c.color : 'var(--divider)'}`,
                        background: on ? c.bg : 'none',
                        color: on ? c.color : 'var(--muted)',
                        fontFamily: 'inherit', fontSize: 10, fontWeight: 600,
                        letterSpacing: '0.06em', textTransform: 'uppercase',
                      }}
                      onClick={() => setNewDraft(d => ({ ...d, cat: c.id }))}>
                      {c.label}
                    </button>
                  );
                })}
              </div>
              <textarea
                className="edit-textarea"
                value={newDraft.desc}
                onChange={e => setNewDraft(d => ({ ...d, desc: e.target.value }))}
                onKeyDown={e => { if (e.key === 'Escape') setAddingEvent(false); if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) addEvent(); }}
                placeholder="Description…"
                rows={3}
              />
              <input
                className="edit-source-input"
                value={newDraft.source}
                onChange={e => setNewDraft(d => ({ ...d, source: e.target.value }))}
                placeholder="Source attribution…"
                onKeyDown={e => { if (e.key === 'Escape') setAddingEvent(false); if (e.key === 'Enter') addEvent(); }}
              />
              <div className="edit-actions">
                <button className="edit-cancel-btn" onClick={() => setAddingEvent(false)}>Cancel</button>
                <button className="edit-save-btn" onClick={addEvent}>Add event</button>
              </div>
            </div>
          )}

          {/* Density chart */}
          <div className="density-wrap">
            <div className="density-label">Event density by 5-year period</div>
            <div className="density-chart">
              {bucketCounts.filter(b => b.start >= 1965 && b.end <= 2029).map(b => {
                const h = maxCount > 0 ? (b.count / maxCount) * 100 : 0;
                const inRange = b.start <= yearMax && b.end >= yearMin;
                return (
                  <div key={b.start} className={`density-bar-wrap${inRange ? ' active' : ''}`}
                    onClick={() => { setYearMin(b.start); setYearMax(b.end); }}>
                    <div className="density-bar" style={{
                      height: `${Math.max(h, 4)}%`,
                      opacity: inRange ? 1 : 0.35,
                    }} />
                    {b.start % 10 === 0 || b.start === 1967 ?
                      <span className="density-bar-year">{b.start}</span> :
                      <span className="density-bar-year" style={{ opacity: 0 }}>{b.start}</span>}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Decade sections */}
          {filtered.length === 0 && (
            <div className="no-results">No events match current filters.</div>
          )}

          {DECADE_ORDER.map(decade => {
            const events = byDecade[decade];
            if (!events || events.length === 0) return null;
            return (
              <div key={decade} className="decade-section"
                ref={el => decadeRefs.current[decade] = el}
                data-screen-label={decade}>
                <div className="decade-heading">
                  <span className="decade-year-label">{decade}</span>
                  <span className="decade-pill">{events.length} event{events.length !== 1 ? 's' : ''}</span>
                </div>
                <div className="events-column">
                  <div className="spine-line" />
                  {events.map((ev, i) => {
                    const cat = catMap[ev.cat];
                    const isEditing = editingIdx === ev._idx;
                    return (
                      <div key={ev._idx} className="event-row">
                        <div className="event-date-col">
                          <div className="event-date">{ev.date}</div>
                          <div className="spine-dot" style={{ backgroundColor: cat.color }} />
                        </div>
                        <div className="event-card" style={{ borderLeftColor: cat.color, position: 'relative' }}>
                          <div className="event-card-top">
                            <span className="event-category-badge" style={{
                              backgroundColor: cat.bg,
                              color: cat.color,
                            }}>{cat.label}</span>
                            {ev.edited && !isEditing && (
                              <span className="edited-marker">edited</span>
                            )}
                            {!isEditing && (
                              <button className="edit-btn" title="Edit event"
                                onClick={() => startEdit(ev._idx, ev)}>
                                <PencilIcon />
                              </button>
                            )}
                          </div>
                          {isEditing ? (
                            <div className="edit-form">
                              <div style={{ display: 'flex', gap: 8 }}>
                                <input
                                  className="edit-source-input"
                                  style={{ fontStyle: 'normal', fontWeight: 600, fontSize: 13, flex: 2 }}
                                  value={draft.title || ''}
                                  onChange={e => setDraft(d => ({ ...d, title: e.target.value }))}
                                  placeholder="Event title…"
                                  onKeyDown={e => { if (e.key === 'Escape') cancelEdit(); }}
                                />
                                <input
                                  className="edit-source-input"
                                  style={{ fontStyle: 'normal', flex: 1 }}
                                  value={draft.date || ''}
                                  onChange={e => setDraft(d => ({ ...d, date: e.target.value }))}
                                  placeholder="Date (e.g. Mar 1978)…"
                                  onKeyDown={e => { if (e.key === 'Escape') cancelEdit(); }}
                                />
                              </div>
                              <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap' }}>
                                {CATEGORIES.map(c => {
                                  const on = draft.cat === c.id;
                                  return (
                                    <button key={c.id}
                                      style={{
                                        padding: '2px 8px', borderRadius: 3, cursor: 'pointer',
                                        border: `1.5px solid ${on ? c.color : 'var(--divider)'}`,
                                        background: on ? c.bg : 'none',
                                        color: on ? c.color : 'var(--muted)',
                                        fontFamily: 'inherit', fontSize: 10, fontWeight: 600,
                                        letterSpacing: '0.06em', textTransform: 'uppercase',
                                      }}
                                      onClick={() => setDraft(d => ({ ...d, cat: c.id }))}>
                                      {c.label}
                                    </button>
                                  );
                                })}
                              </div>
                              <textarea
                                ref={editTextareaRef}
                                className="edit-textarea"
                                value={draft.desc}
                                onChange={e => setDraft(d => ({ ...d, desc: e.target.value }))}
                                onKeyDown={e => { if (e.key === 'Escape') cancelEdit(); if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) saveEdit(ev._idx); }}
                                rows={3}
                              />
                              <input
                                className="edit-source-input"
                                value={draft.source || ''}
                                onChange={e => setDraft(d => ({ ...d, source: e.target.value }))}
                                placeholder="Source attribution…"
                                onKeyDown={e => { if (e.key === 'Escape') cancelEdit(); if (e.key === 'Enter') saveEdit(ev._idx); }}
                              />
                              <div className="edit-actions">
                                {confirmDeleteIdx === ev._idx ? (
                                  <>
                                    <span style={{ fontSize: 11, color: '#c0392b', marginRight: 'auto', alignSelf: 'center' }}>Delete this event?</span>
                                    <button className="edit-cancel-btn" onClick={() => setConfirmDeleteIdx(null)}>No</button>
                                    <button style={{
                                      padding: '4px 14px', background: '#c0392b', color: 'white',
                                      border: 'none', borderRadius: 3, fontFamily: 'inherit',
                                      fontSize: 11, fontWeight: 600, cursor: 'pointer',
                                    }} onClick={() => deleteEvent(ev._idx)}>Confirm delete</button>
                                  </>
                                ) : (
                                  <>
                                    <button style={{
                                      padding: '4px 10px', background: 'none', color: '#c0392b',
                                      border: '1px solid #e8c4c0', borderRadius: 3, fontFamily: 'inherit',
                                      fontSize: 11, cursor: 'pointer', marginRight: 'auto',
                                    }} onClick={() => setConfirmDeleteIdx(ev._idx)}>Delete</button>
                                    <button className="edit-cancel-btn" onClick={cancelEdit}>Cancel</button>
                                    <button className="edit-save-btn" onClick={() => saveEdit(ev._idx)}>Save</button>
                                  </>
                                )}
                              </div>
                            </div>
                          ) : (
                            <>
                              {ev.title && <div className="event-title">{ev.title}</div>}
                              <div className="event-desc">{ev.desc}</div>
                              {ev.source && <div className="event-source">{ev.source}</div>}
                            </>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Tweaks panel */}
      <div className={`tweaks-panel${tweaksOpen ? ' open' : ''}`}>
        <div className="tweaks-title">Tweaks</div>
        <div className="tweak-row">
          <span className="tweak-label">Card style</span>
          <div className="tweak-options">
            {['bordered','minimal','filled'].map(v => (
              <button key={v} className={`tweak-btn${tweaks.cardStyle === v ? ' active' : ''}`}
                onClick={() => {
                  window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { cardStyle: v } }, '*');
                }}>{v}</button>
            ))}
          </div>
        </div>
        <div className="tweak-row">
          <span className="tweak-label">Density</span>
          <div className="tweak-options">
            {['compact','comfortable','spacious'].map(v => (
              <button key={v} className={`tweak-btn${tweaks.density === v ? ' active' : ''}`}
                onClick={() => {
                  window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { density: v } }, '*');
                }}>{v}</button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
